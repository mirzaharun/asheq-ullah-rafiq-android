name: Build & Publish Official Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename Official APK & Compute SHA-256 Checksum
        id: package_apk
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SOURCE" dist/AsheqUllahRafiq.apk
          SHA256=$(sha256sum dist/AsheqUllahRafiq.apk | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s dist/AsheqUllahRafiq.apk)
          SIZE_MB=$(awk "BEGIN {printf \"%.2f MB\", $SIZE_BYTES/1048576}")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "file_size=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"
          echo "Size: $SIZE_MB"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Asheq Ullah Rafiq Portal ${{ github.ref_name }}"
          body: |
            Official Android APK Release (`com.ashequllah.portal`)
            - File: `AsheqUllahRafiq.apk`
            - Size: `${{ steps.package_apk.outputs.file_size }}`
            - SHA-256: `${{ steps.package_apk.outputs.sha256 }}`
          files: |
            dist/AsheqUllahRafiq.apk
          draft: false
          prerelease: false
